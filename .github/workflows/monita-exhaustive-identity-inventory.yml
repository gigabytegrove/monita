name: Monita exhaustive identity inventory

on:
  push:
    branches:
      - monita-complete-cleanup

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: List files containing legacy identity
        shell: bash
        run: |
          set -u
          git grep -Il -i -E 'gotify' -- . ':!.github/workflows/monita-exhaustive-identity-inventory.yml' | sort || true
