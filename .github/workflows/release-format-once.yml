name: one-shot release formatter

on:
  push:
    branches:
      - release/v1.3.9-alpha

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.3.9-alpha
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - run: cd ui && yarn --frozen-lockfile
      - name: Format UI
        run: cd ui && yarn prettier "src/**/*.{ts,tsx}" --write
      - name: Commit formatted UI
        run: |
          if git diff --quiet -- ui/src; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/src
          git commit -m "chore: format UI for release [formatted]"
          git push origin HEAD:release/v1.3.9-alpha
