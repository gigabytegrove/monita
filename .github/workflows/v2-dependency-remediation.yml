name: One-time Monita 2.0 dependency remediation
on:
  push:
    branches:
      - work/v2.0.0-security
    paths:
      - .github/workflows/v2-dependency-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v2.0.0-security
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remediate Go HTTP2 vulnerability and refresh module checksums
        run: |
          go get golang.org/x/net@v0.60.0
          go mod tidy
          go mod verify
      - name: Remediate transitive source-map-js vulnerability and lock it
        run: |
          cd ui
          corepack enable
          yarn install
          yarn why source-map-js
      - name: Verify neither vulnerable dependency remains
        run: |
          set -euo pipefail
          grep -Fq 'golang.org/x/net v0.60.0' go.mod
          ! grep -E '^\s*golang.org/x/net v0.58.0' go.mod
          grep -Fq 'version "1.2.2"' ui/yarn.lock
          ! grep -A2 '^source-map-js@' ui/yarn.lock | grep -Fx '  version "1.2.1"'
          git status --short
      - name: Commit the dependency lockfile and checksum remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum ui/package.json ui/yarn.lock
          if git diff --cached --quiet; then
            echo 'Dependencies already remediated'
            exit 0
          fi
          git commit -m "security: fix high-severity x/net and source-map-js dependencies"
          git push origin HEAD:refs/heads/work/v2.0.0-security
