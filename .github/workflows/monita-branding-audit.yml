name: Monita identity audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject retired product identity
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -nIi -E 'gotify|gotify[-_ ]?mu|gotifymu' -- . ':!LICENSE' ':!CHANGELOG.md' ':!docs/releases/**' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Retired product identity remains in active Monita source."
            exit 1
          fi
